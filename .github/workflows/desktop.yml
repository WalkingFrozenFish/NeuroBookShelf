name: Desktop installers

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/check_version.py
      - name: Match release tag to application version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python scripts/check_version.py "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"

  installers:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
          - os: macos-15
            platform: macos-arm64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      SIGN_MACOS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build and smoke-test private Python runtime
        env:
          APPLE_SIGNING_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: python scripts/build_runtime.py
      - name: Verify first-run model download, OCR and translation
        run: python scripts/smoke_models.py
      - name: Database and filesystem tests (Python protocol smoke tested above)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --skip worker::tests
      - name: Build installers without Apple certificate
        if: runner.os != 'macOS' || env.SIGN_MACOS != 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
      - name: Build macOS installer with Developer ID and notarization
        if: runner.os == 'macOS' && env.SIGN_MACOS == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
      - name: Verify runtime copied into Windows package
        if: runner.os == 'Windows'
        run: python scripts/smoke_runtime.py src-tauri/target/release/runtime
      - name: Verify runtime copied into macOS app and sealed signature
        if: runner.os == 'macOS'
        run: |
          python scripts/smoke_runtime.py src-tauri/target/release/bundle/macos/NeuroBookShelf.app/Contents/Resources/runtime
          codesign --verify --deep --strict src-tauri/target/release/bundle/macos/NeuroBookShelf.app
      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        run: python scripts/package_portable.py
      - name: Generate package checksums
        run: python scripts/release_checksums.py "${{ matrix.platform }}"
      - name: Upload installers and portable archive
        uses: actions/upload-artifact@v4
        with:
          name: NeuroBookShelf-${{ matrix.platform }}-${{ github.sha }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            bundle/*-portable.zip
            bundle/SHA256SUMS-*.txt

  ci:
    name: CI
    if: always()
    needs: [checks, installers]
    runs-on: ubuntu-latest
    steps:
      - name: Require checks and both installer builds
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          INSTALLERS_RESULT: ${{ needs.installers.result }}
        run: test "$CHECKS_RESULT" = success && test "$INSTALLERS_RESULT" = success

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checks, installers, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: NeuroBookShelf-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: Publish complete release after both platforms pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_release_assets.py --directory release-assets --write-upload-list release-assets-list.txt
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "NeuroBookShelf $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          elif [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" != true ]; then
            echo "This version is already published. Create a new version instead of replacing its files."
            exit 1
          fi
          mapfile -t files < release-assets-list.txt
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > release-assets.txt
          python scripts/check_release_assets.py release-assets.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file RELEASE_NOTES.md
