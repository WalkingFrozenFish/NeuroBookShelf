name: Feature request / Предложение
description: Suggest an improvement / Предложить улучшение.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve? / Какую задачу хотите решить?
      description: English or Russian. Describe your use case and current obstacle. / Опишите сценарий и что сейчас мешает.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior / Предлагаемое поведение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and examples / Альтернативы и примеры
