<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroBookShelf</title>
    <script>
      try {
        var cached = localStorage.getItem("llr-appearance");
        var legacy = localStorage.getItem("llr-theme");
        var appearance = cached ? JSON.parse(cached) : {
          mode: legacy === "dark" ? "dark" : "light",
          accent: legacy === "sage" ? "green" : legacy === "rose" ? "rose" : legacy === "mist" ? "teal" : "blue",
          pdf: "original"
        };
        document.documentElement.dataset.theme = appearance.mode === "dark" ? "dark" : "light";
        document.documentElement.dataset.accent = appearance.accent;
        document.documentElement.dataset.pdf = appearance.pdf;
        document.documentElement.lang = appearance.language === "en" ? "en" : "ru";
        if (appearance.accent === "custom" && /^#[0-9a-f]{6}$/i.test(appearance.customColor || "")) {
          var rgb = [1, 3, 5].map(function (start) { return parseInt(appearance.customColor.slice(start, start + 2), 16) / 255; });
          var max = Math.max.apply(null, rgb), min = Math.min.apply(null, rgb), delta = max - min;
          var hue = delta === 0 ? 215 : ((max === rgb[0] ? (rgb[1] - rgb[2]) / delta : max === rgb[1] ? (rgb[2] - rgb[0]) / delta + 2 : (rgb[0] - rgb[1]) / delta + 4) * 60 + 360) % 360;
          document.documentElement.style.setProperty("--hue", String(hue));
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
