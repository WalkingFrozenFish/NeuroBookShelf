[package]
name = "local-library-reader"
version = "0.2.0"
description = "Offline PDF library with local OCR and multilingual translation"
license = "AGPL-3.0-only"
repository = "https://github.com/WalkingFrozenFish/NeuroBookShelf"
edition = "2024"

[lib]
# `_lib` avoids a Windows name clash between the library and the binary.
name = "local_library_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
